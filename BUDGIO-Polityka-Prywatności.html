<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BUDGIO — Polityka prywatności</title><style>:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#5e687a;--accent:#356ae6;--border:#e2e7f0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;line-height:1.65}.wrap{max-width:900px;margin:auto;padding:28px 18px 50px}.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:30px;box-shadow:0 5px 24px rgba(20,35,65,.06)}h1{margin:0 0 8px;font-size:32px}h2{margin-top:30px;font-size:21px}p{font-size:15px}.muted,footer{color:var(--muted)}.lang{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}.lang button{border:1px solid var(--border);background:#fff;border-radius:10px;padding:9px 13px;cursor:pointer;font-weight:700}.lang button.active{background:var(--accent);color:#fff;border-color:var(--accent)}a{color:var(--accent)}footer{margin-top:22px;font-size:13px}</style></head><body><div class="wrap"><div class="card"><div class="lang"><button data-lang="pl">PL</button><button data-lang="de">DE</button><button data-lang="en">EN</button><button data-lang="fr">FR</button><button data-lang="es">ES</button></div><div id="content"></div><footer id="footer"></footer></div></div><script>
const D={
pl:{t:'Polityka prywatności BUDGIO',i:'Niniejsza polityka prywatności wyjaśnia, w jaki sposób aplikacja BUDGIO przetwarza dane użytkownika.',s:[['1. Administrator danych','Administratorem danych związanych z korzystaniem z BUDGIO jest twórca i operator aplikacji. Kontakt: <a href="mailto:m.wasiewicz91@gmail.com">m.wasiewicz91@gmail.com</a>.'],['2. Jakie dane przetwarza BUDGIO','BUDGIO może przetwarzać dane wprowadzane przez użytkownika, w szczególności dane dotyczące dochodów, wydatków, oszczędności, celów oszczędnościowych, zobowiązań i harmonogramów płatności. Aplikacja może również przetwarzać ustawienia aplikacji oraz informacje techniczne niezbędne do jej działania.'],['3. Dane logowania Google i Google Drive','Jeżeli użytkownik korzysta z kopii zapasowej Google Drive, BUDGIO korzysta z autoryzacji Google w zakresie niezbędnym do zapisania lub odtworzenia kopii zapasowej. Dane finansowe z kopii zapasowej są przechowywane na koncie Google Drive użytkownika i pozostają pod jego kontrolą. BUDGIO nie otrzymuje hasła do konta Google.'],['4. Zakupy i Google Play','BUDGIO może oferować jednorazowy zakup funkcji Premium za pośrednictwem Google Play. Płatność i dane związane z transakcją są obsługiwane przez Google Play zgodnie z zasadami Google. BUDGIO otrzymuje od Google informacje niezbędne do ustalenia, czy zakup Premium został prawidłowo dokonany.'],['5. Cel przetwarzania','Dane są przetwarzane w celu zapewnienia funkcji aplikacji, tworzenia i odtwarzania kopii zapasowych na żądanie użytkownika, obsługi zakupów Premium, poprawnego działania aplikacji oraz udzielania pomocy użytkownikowi.'],['6. Udostępnianie danych','BUDGIO nie sprzedaje danych osobowych. Dane mogą być przekazywane dostawcom usług wyłącznie w zakresie koniecznym do świadczenia danej funkcji, np. Google w związku z logowaniem, Google Drive lub Google Play.'],['7. Przechowywanie danych','Dane zapisane lokalnie są przechowywane na urządzeniu użytkownika. Kopie zapasowe utworzone w Google Drive są przechowywane na koncie Google użytkownika. Użytkownik może usuwać dane aplikacji oraz kopie zapasowe zgodnie z dostępnymi funkcjami systemu i usług Google.'],['8. Bezpieczeństwo','Stosujemy odpowiednie środki techniczne i organizacyjne mające na celu ochronę danych. Żadna metoda przechowywania ani transmisji danych nie gwarantuje jednak absolutnego bezpieczeństwa.'],['9. Prawa użytkownika','W zakresie wynikającym z obowiązujących przepisów użytkownik może mieć prawo do dostępu do danych, ich poprawienia, usunięcia, ograniczenia przetwarzania lub wniesienia sprzeciwu. Kontakt: <a href="mailto:m.wasiewicz91@gmail.com">m.wasiewicz91@gmail.com</a>.'],['10. Dzieci','BUDGIO nie jest przeznaczone do świadomego zbierania danych osobowych od dzieci bez wymaganej zgody opiekuna prawnego.'],['11. Zmiany polityki','Polityka prywatności może być okresowo aktualizowana, np. w związku ze zmianą funkcji aplikacji lub przepisów prawa. Aktualna wersja będzie publikowana pod tym adresem.'],['12. Kontakt','Pytania dotyczące prywatności można kierować na: <a href="mailto:m.wasiewicz91@gmail.com">m.wasiewicz91@gmail.com</a>.']]},
de:{t:'Datenschutzerklärung von BUDGIO',i:'Diese Datenschutzerklärung erläutert, wie die BUDGIO-App Nutzerdaten verarbeitet.',s:[['1. Verantwortlicher','Verantwortlich für die mit der Nutzung von BUDGIO verbundenen Daten ist der Ersteller und Betreiber der App. Kontakt: <a href="mailto:m.wasiewicz91@gmail.com">m.wasiewicz91@gmail.com</a>.'],['2. Welche Daten BUDGIO verarbeitet','BUDGIO kann vom Nutzer eingegebene Daten verarbeiten, insbesondere Daten zu Einnahmen, Ausgaben, Ersparnissen, Sparzielen, Verbindlichkeiten und Zahlungsplänen. Außerdem können App-Einstellungen und technische Informationen verarbeitet werden, soweit dies für den Betrieb erforderlich ist.'],['3. Google-Anmeldung und Google Drive','Wenn der Nutzer Google Drive für Sicherungen verwendet, nutzt BUDGIO die Google-Autorisierung nur im erforderlichen Umfang zum Erstellen oder Wiederherstellen einer Sicherung. Finanzdaten aus der Sicherung werden im Google-Drive-Konto des Nutzers gespeichert und bleiben unter seiner Kontrolle. BUDGIO erhält kein Google-Passwort.'],['4. Käufe und Google Play','BUDGIO kann einen einmaligen Premium-Kauf über Google Play anbieten. Zahlung und transaktionsbezogene Daten werden von Google Play nach den geltenden Google-Bedingungen verarbeitet. BUDGIO erhält die für die Feststellung eines gültigen Premium-Kaufs erforderlichen Informationen.'],['5. Zweck der Verarbeitung','Die Daten werden zur Bereitstellung der App-Funktionen, zum Erstellen und Wiederherstellen von Sicherungen auf Wunsch des Nutzers, zur Abwicklung von Premium-Käufen, für den ordnungsgemäßen Betrieb und zur Unterstützung des Nutzers verarbeitet.'],['6. Weitergabe von Daten','BUDGIO verkauft keine personenbezogenen Daten. Daten können Dienstleistern nur insoweit übermittelt werden, wie dies für die jeweilige Funktion erforderlich ist, z. B. Google für Anmeldung, Google Drive oder Google Play.'],['7. Speicherung','Lokal gespeicherte Daten befinden sich auf dem Gerät des Nutzers. In Google Drive erstellte Sicherungen werden im Google-Konto des Nutzers gespeichert. Der Nutzer kann App-Daten und Sicherungen entsprechend den verfügbaren Geräte- und Google-Funktionen löschen.'],['8. Sicherheit','Wir setzen angemessene technische und organisatorische Maßnahmen zum Schutz der Daten ein. Keine Methode der Speicherung oder Übertragung kann jedoch absolute Sicherheit garantieren.'],['9. Rechte des Nutzers','Nach dem anwendbaren Recht können Nutzer Rechte auf Auskunft, Berichtigung, Löschung, Einschränkung der Verarbeitung oder Widerspruch haben. Kontakt: <a href="mailto:m.wasiewicz91@gmail.com">m.wasiewicz91@gmail.com</a>.'],['10. Kinder','BUDGIO ist nicht darauf ausgerichtet, wissentlich personenbezogene Daten von Kindern ohne die erforderliche Zustimmung eines Erziehungsberechtigten zu erheben.'],['11. Änderungen','Diese Datenschutzerklärung kann bei Änderungen der App-Funktionen oder der Rechtslage aktualisiert werden. Die aktuelle Fassung wird unter dieser Adresse veröffentlicht.'],['12. Kontakt','Fragen zum Datenschutz: <a href="mailto:m.wasiewicz91@gmail.com">m.wasiewicz91@gmail.com</a>.']]},
en:{t:'BUDGIO Privacy Policy',i:'This Privacy Policy explains how the BUDGIO app processes user data.',s:[['1. Data controller','The creator and operator of BUDGIO is responsible for data associated with use of the app. Contact: <a href="mailto:m.wasiewicz91@gmail.com">m.wasiewicz91@gmail.com</a>.'],['2. Data processed by BUDGIO','BUDGIO may process information entered by the user, including income, expenses, savings, savings goals, liabilities and payment schedules. App settings and technical information necessary to operate the app may also be processed.'],['3. Google sign-in and Google Drive','If the user uses Google Drive backup, BUDGIO uses Google authorization only as necessary to create or restore a backup. Financial data contained in a backup is stored in the user’s Google Drive account and remains under the user’s control. BUDGIO does not receive the user’s Google password.'],['4. Purchases and Google Play','BUDGIO may offer a one-time Premium purchase through Google Play. Payment and transaction-related data are handled by Google Play under Google’s applicable terms. BUDGIO receives information necessary to determine whether a valid Premium purchase exists.'],['5. Purpose of processing','Data is processed to provide app functionality, create and restore backups at the user’s request, handle Premium purchases, operate the app correctly and provide user support.'],['6. Sharing of data','BUDGIO does not sell personal data. Data may be shared with service providers only to the extent necessary to provide a specific feature, such as Google for sign-in, Google Drive or Google Play.'],['7. Data storage','Data stored locally is kept on the user’s device. Backups created in Google Drive are stored in the user’s Google account. Users can delete app data and backups using the available device and Google service functions.'],['8. Security','We use appropriate technical and organizational measures designed to protect data. However, no method of storage or transmission can guarantee absolute security.'],['9. User rights','Depending on applicable law, users may have rights to access, correct or delete data, restrict processing, or object to processing. Privacy contact: <a href="mailto:m.wasiewicz91@gmail.com">m.wasiewicz91@gmail.com</a>.'],['10. Children','BUDGIO is not intended to knowingly collect personal data from children without the required consent of a parent or legal guardian.'],['11. Changes to this policy','This Privacy Policy may be updated from time to time, for example when app functionality or applicable law changes. The current version will be published at this address.'],['12. Contact','Privacy questions: <a href="mailto:m.wasiewicz91@gmail.com">m.wasiewicz91@gmail.com</a>.']]},
fr:{t:'Politique de confidentialité de BUDGIO',i:"Cette politique explique comment l'application BUDGIO traite les données des utilisateurs.",s:[['1. Responsable du traitement','Le créateur et l’opérateur de BUDGIO sont responsables des données liées à l’utilisation de l’application. Contact : <a href="mailto:m.wasiewicz91@gmail.com">m.wasiewicz91@gmail.com</a>.'],['2. Données traitées','BUDGIO peut traiter les données saisies par l’utilisateur, notamment les revenus, dépenses, économies, objectifs d’épargne, dettes et échéanciers de paiement. Les paramètres de l’application et les informations techniques nécessaires à son fonctionnement peuvent également être traités.'],['3. Connexion Google et Google Drive','Si l’utilisateur utilise la sauvegarde Google Drive, BUDGIO utilise l’autorisation Google uniquement dans la mesure nécessaire pour créer ou restaurer une sauvegarde. Les données financières d’une sauvegarde sont stockées dans le compte Google Drive de l’utilisateur et restent sous son contrôle. BUDGIO ne reçoit pas le mot de passe Google.'],['4. Achats et Google Play','BUDGIO peut proposer un achat Premium unique via Google Play. Le paiement et les données de transaction sont traités par Google Play conformément aux conditions de Google. BUDGIO reçoit les informations nécessaires pour vérifier l’existence d’un achat Premium valide.'],['5. Finalités','Les données sont traitées pour fournir les fonctions de l’application, créer et restaurer les sauvegardes à la demande de l’utilisateur, gérer les achats Premium, assurer le bon fonctionnement et fournir une assistance.'],['6. Partage des données','BUDGIO ne vend pas les données personnelles. Les données peuvent être transmises à des prestataires uniquement dans la mesure nécessaire à une fonction, par exemple Google pour la connexion, Google Drive ou Google Play.'],['7. Conservation','Les données stockées localement sont conservées sur l’appareil de l’utilisateur. Les sauvegardes créées dans Google Drive sont stockées dans le compte Google de l’utilisateur. L’utilisateur peut supprimer les données et sauvegardes selon les fonctions disponibles.'],['8. Sécurité','Nous mettons en œuvre des mesures techniques et organisationnelles appropriées pour protéger les données. Aucune méthode de stockage ou de transmission ne garantit toutefois une sécurité absolue.'],['9. Droits de l’utilisateur','Selon la législation applicable, l’utilisateur peut disposer de droits d’accès, de rectification, d’effacement, de limitation du traitement ou d’opposition. Contact : <a href="mailto:m.wasiewicz91@gmail.com">m.wasiewicz91@gmail.com</a>.'],['10. Enfants','BUDGIO n’est pas destiné à collecter sciemment des données personnelles d’enfants sans le consentement requis d’un parent ou représentant légal.'],['11. Modifications','Cette politique peut être mise à jour en cas de modification des fonctions de l’application ou de la législation. La version actuelle sera publiée à cette adresse.'],['12. Contact','Questions relatives à la confidentialité : <a href="mailto:m.wasiewicz91@gmail.com">m.wasiewicz91@gmail.com</a>.']]},
es:{t:'Política de privacidad de BUDGIO',i:'Esta política explica cómo la aplicación BUDGIO trata los datos de los usuarios.',s:[['1. Responsable','El creador y operador de BUDGIO es responsable de los datos relacionados con el uso de la aplicación. Contacto: <a href="mailto:m.wasiewicz91@gmail.com">m.wasiewicz91@gmail.com</a>.'],['2. Datos tratados','BUDGIO puede tratar los datos introducidos por el usuario, incluidos ingresos, gastos, ahorros, objetivos de ahorro, obligaciones y calendarios de pagos. También pueden tratarse ajustes de la aplicación e información técnica necesaria para su funcionamiento.'],['3. Inicio de sesión con Google y Google Drive','Si el usuario utiliza copias de seguridad de Google Drive, BUDGIO utiliza la autorización de Google únicamente cuando es necesaria para crear o restaurar una copia. Los datos financieros de la copia se almacenan en la cuenta de Google Drive del usuario y permanecen bajo su control. BUDGIO no recibe la contraseña de Google.'],['4. Compras y Google Play','BUDGIO puede ofrecer una compra Premium única mediante Google Play. Google Play gestiona los pagos y los datos de la transacción conforme a sus condiciones. BUDGIO recibe la información necesaria para comprobar si existe una compra Premium válida.'],['5. Finalidad','Los datos se tratan para proporcionar las funciones de la aplicación, crear y restaurar copias de seguridad a petición del usuario, gestionar compras Premium, garantizar el funcionamiento correcto y ofrecer asistencia.'],['6. Compartición de datos','BUDGIO no vende datos personales. Los datos pueden compartirse con proveedores de servicios únicamente cuando sea necesario para una función concreta, por ejemplo Google para el inicio de sesión, Google Drive o Google Play.'],['7. Conservación','Los datos almacenados localmente se conservan en el dispositivo del usuario. Las copias creadas en Google Drive se almacenan en la cuenta de Google del usuario. El usuario puede eliminar los datos y las copias mediante las funciones disponibles del dispositivo y de Google.'],['8. Seguridad','Aplicamos medidas técnicas y organizativas adecuadas para proteger los datos. Sin embargo, ningún método de almacenamiento o transmisión puede garantizar una seguridad absoluta.'],['9. Derechos del usuario','Según la legislación aplicable, el usuario puede tener derecho a acceder, corregir o eliminar datos, limitar su tratamiento u oponerse a él. Contacto de privacidad: <a href="mailto:m.wasiewicz91@gmail.com">m.wasiewicz91@gmail.com</a>.'],['10. Menores','BUDGIO no está destinado a recopilar conscientemente datos personales de menores sin el consentimiento requerido de sus padres o tutores legales.'],['11. Cambios','Esta política puede actualizarse cuando cambien las funciones de la aplicación o la legislación aplicable. La versión actual se publicará en esta dirección.'],['12. Contacto','Preguntas sobre privacidad: <a href="mailto:m.wasiewicz91@gmail.com">m.wasiewicz91@gmail.com</a>.']]}};
function render(l){const d=D[l]||D.pl;document.documentElement.lang=l;document.getElementById('content').innerHTML='<h1>'+d.t+'</h1><p class="muted">'+d.i+'</p>'+d.s.map(x=>'<section><h2>'+x[0]+'</h2><p>'+x[1]+'</p></section>').join('');document.getElementById('footer').textContent={pl:'Ostatnia aktualizacja: 9 września 2026 r.',de:'Letzte Aktualisierung: 9. September 2026',en:'Last updated: September 9, 2026',fr:'Dernière mise à jour : 9 septembre 2026',es:'Última actualización: 9 de septiembre de 2026'}[l];document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('active',b.dataset.lang===l));localStorage.setItem('budgio-language',l)}document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>render(b.dataset.lang));render(localStorage.getItem('budgio-language')||'pl');
</script></body></html>
